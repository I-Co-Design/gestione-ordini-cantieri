name: Generatore PDF Ordini Cloud
on:
  repository_dispatch:
    types: [nuovo_ordine_forms]

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
    - name: Scarica Codice ed Excel dal Repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa Librerie per Excel e PDF
      run: |
        sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0
        pip install pandas openpyxl weasyprint

    - name: Esegui Incrocio Dati e Genera PDF
      env:
        DATI_ARTICOLI: ${{ github.event.client_payload.articoli }}
        NAZIONE: ${{ github.event.client_payload.nazione }}
        CANTIERE: ${{ github.event.client_payload.cantiere }}
        MONTATORE: ${{ github.event.client_payload.montatore }}
      run: python elabora_ordine.py

    - name: Carica il PDF nel Cloud di GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Ordine_Materiali_Cantiere
        path: Ordine_Materiali.pdf
        retention-days: 7
