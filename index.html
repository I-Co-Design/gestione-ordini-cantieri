<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#075985">
    <title>Gestione ordini cantieri</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root { color-scheme: light; --blue: #0369a1; --blue-dark: #075985; --green: #059669; --red: #dc2626; --ink: #1e293b; --muted: #64748b; --line: #e2e8f0; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px 16px; background: #f1f5f9; color: var(--ink); font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        main { width: min(900px, 100%); margin: 0 auto; }
        .page-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
        .page-header .logo { width: 120px; height: auto; display: block; filter: grayscale(100%) contrast(1.05); }
        .page-header .header-text { flex: 1; }
        h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2rem); }
        h2 { margin: 0 0 16px; color: var(--blue-dark); font-size: 1.2rem; }
        .intro { margin: 0; color: var(--muted); }
        .card { margin-bottom: 16px; padding: 22px; background: #fff; border: 1px solid #e8edf2; border-radius: 14px; box-shadow: 0 4px 14px rgb(15 23 42 / 5%); }
        label { display: block; margin: 12px 0 6px; font-weight: 650; }
        input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; color: var(--ink); font: inherit; }
        input:focus, button:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 2px; }
        .country-buttons { display: flex; gap: 10px; margin-top: 8px; }
        button { font: inherit; }
        .btn { min-height: 44px; padding: 10px 16px; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .country { flex: 1; background: #e2e8f0; color: #334155; }
        .country.active { background: var(--blue); color: white; }
        .primary { width: 100%; margin-top: 14px; background: var(--green); color: white; }
        .add { width: 100%; margin-top: 12px; background: var(--blue); color: white; }
        .btn:disabled { cursor: not-allowed; opacity: .55; }
        .status { min-height: 24px; margin: 8px 0 0; color: var(--muted); font-size: .92rem; }
        .search-wrap { position: relative; }
        .results { position: absolute; z-index: 5; top: calc(100% - 8px); right: 0; left: 0; display: none; max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: white; box-shadow: 0 8px 18px rgb(15 23 42 / 12%); }
        .results.open { display: block; }
        .result { display: block; width: 100%; padding: 11px 12px; border: 0; border-bottom: 1px solid #f1f5f9; background: white; color: var(--ink); text-align: left; cursor: pointer; }
        .result:hover, .result:focus { background: #f0f9ff; }
        .result-code { display: inline-block; margin-right: 7px; padding: 2px 6px; border-radius: 4px; background: #e0f2fe; color: #075985; font-size: .82rem; font-weight: 750; }
        .quantity { max-width: 180px; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 11px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
        th { background: #f8fafc; font-size: .9rem; }
        .remove { border: 0; background: none; color: var(--red); font-weight: 700; cursor: pointer; }
        .empty { padding: 18px 8px; color: var(--muted); text-align: center; }
        .cart-count { color: var(--muted); font-size: .95rem; font-weight: 500; }
        @media (max-width: 600px) {
            body { padding: 14px 10px; }
            .card { padding: 17px; }
            .page-header { gap: 10px; }
            .page-header .logo { width: 80px; }
            th, td { padding: 9px 7px; font-size: .9rem; }
        }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#075985">
</head>
<body>
<main>
    <header class="page-header">
        <img src="logoico_grigio.png" alt="Logo Ico Design" class="logo">
        <div class="header-text">
            <h1>Gestione ordini cantieri</h1>
            <p class="intro">Inserisci i dati del cantiere, scegli il catalogo e aggiungi gli articoli all’ordine.</p>
        </div>
    </header>

    <section class="card" aria-labelledby="info-title">
        <h2 id="info-title">📋 Informazioni cantiere</h2>
        <label for="montatore">Nome montatore</label>
        <input id="montatore" type="text" placeholder="Es. Mario Rossi" autocomplete="name">
        <label for="cantiere">Punto vendita / cantiere</label>
        <input id="cantiere" type="text" placeholder="Es. Negozio Milano">
        <label>Nazione</label>
        <div class="country-buttons" role="group" aria-label="Seleziona la nazione">
            <button type="button" class="btn country active" id="btn-italia" aria-pressed="true">Italia</button>
            <button type="button" class="btn country" id="btn-spagna" aria-pressed="false">Spagna</button>
        </div>
    </section>

    <section class="card" aria-labelledby="search-title">
        <h2 id="search-title">🔍 Cerca un articolo</h2>
        <label for="search-input">Codice o descrizione</label>
        <div class="search-wrap">
            <input id="search-input" type="search" placeholder="Digita almeno 2 caratteri…" autocomplete="off" aria-autocomplete="list" aria-controls="results-box">
            <div id="results-box" class="results" role="listbox" aria-label="Risultati catalogo"></div>
        </div>
        <p id="catalog-status" class="status" role="status" aria-live="polite">Caricamento catalogo…</p>
        <label for="quantita-input">Quantità</label>
        <input class="quantity" id="quantita-input" type="number" value="1" min="1" step="1" inputmode="numeric">
        <button type="button" class="btn add" id="add-button" disabled>＋ Aggiungi alla lista</button>
    </section>

    <section class="card" aria-labelledby="cart-title">
        <h2 id="cart-title">🛒 Lista articoli <span class="cart-count" id="cart-count">(0 articoli)</span></h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th scope="col">Codice</th><th scope="col">Descrizione</th><th scope="col">Quantità</th><th scope="col">Azione</th></tr></thead>
                <tbody id="lista-corpo"><tr><td class="empty" colspan="4">La lista è vuota.</td></tr></tbody>
            </table>
        </div>
        <button type="button" class="btn primary" id="print-button">📄 Crea pagina di stampa / PDF</button>
    </section>
</main>

<script>
(() => {
    'use strict';

    const $ = (id) => document.getElementById(id);
    const countryFiles = { ITALIA: 'ITALIA.csv', SPAGNA: 'SPAGNA.csv' };
    let nazioneAttuale = 'ITALIA';
    let catalogo = [];
    let articoloSelezionato = null;
    let carrello = [];
    let richiestaCatalogo = 0;

    function setStato(messaggio) {
        $('catalog-status').textContent = messaggio;
    }

    function pulisciValore(value) {
        return value == null ? '' : String(value).replace(/^\uFEFF/, '').trim();
    }

    function caricaCatalogo() {
        const richiesta = ++richiestaCatalogo;
        catalogo = [];
        articoloSelezionato = null;
        $('search-input').value = '';
        $('results-box').replaceChildren();
        $('results-box').classList.remove('open');
        $('add-button').disabled = true;
        setStato(`Caricamento catalogo ${nazioneAttuale}…`);

        if (!window.Papa) {
            setStato('Errore: libreria CSV non disponibile. Ricarica la pagina e riprova.');
            return;
        }

        Papa.parse(countryFiles[nazioneAttuale], {
            download: true,
            delimiter: ';',
            header: false,
            skipEmptyLines: 'greedy',
            complete(results) {
                if (richiesta !== richiestaCatalogo) return;
                if (results.errors && results.errors.length && !results.data.length) {
                    setStato('Errore durante la lettura del catalogo. Controlla il file CSV.');
                    return;
                }

                catalogo = (results.data || []).slice(4).map((r) => {
                    const spagna = nazioneAttuale === 'SPAGNA';
                    const codiceCliente = pulisciValore(r[0]);
                    const codice = pulisciValore(r[1]) || codiceCliente;
                    const descrizione = pulisciValore(r[spagna ? 5 : 2]);
                    const codiceDisegno = spagna ? pulisciValore(r[2]) : '';
                    return { codice, codiceCliente, codiceDisegno, descrizione };
                }).filter((item) => item.codice || item.codiceCliente || item.codiceDisegno || item.descrizione);

                setStato(catalogo.length
                    ? `Catalogo ${nazioneAttuale} caricato: ${catalogo.length} articoli.`
                    : `Nessun articolo trovato nel file ${countryFiles[nazioneAttuale]}.`);
            },
            error(error) {
                if (richiesta !== richiestaCatalogo) return;
                setStato(`Impossibile leggere ${countryFiles[nazioneAttuale]}. Verifica che il file sia presente e che la pagina sia servita da GitHub Pages o da un server web. (${error.message || 'errore di rete'})`);
            }
        });
    }

    function cambiaNazione(nazione) {
        if (nazione === nazioneAttuale) return;
        if (carrello.length && !window.confirm('Cambiando nazione la lista attuale verrà svuotata. Vuoi continuare?')) return;
        nazioneAttuale = nazione;
        carrello = [];
        aggiornaTabella();
        ['ITALIA', 'SPAGNA'].forEach((value) => {
            const button = $('btn-' + value.toLowerCase());
            const attivo = value === nazione;
            button.classList.toggle('active', attivo);
            button.setAttribute('aria-pressed', String(attivo));
        });
        caricaCatalogo();
    }

    function mostraRisultati(query) {
        const box = $('results-box');
        const termine = query.trim().toLocaleLowerCase('it');
        box.replaceChildren();
        articoloSelezionato = null;
        $('add-button').disabled = true;
        if (termine.length < 2) {
            box.classList.remove('open');
            return;
        }
        if (!catalogo.length) {
            box.classList.remove('open');
            return;
        }

        const risultati = catalogo.filter((item) =>
            [item.codice, item.codiceCliente, item.codiceDisegno, item.descrizione]
                .some((value) => value.toLocaleLowerCase('it').includes(termine))
        ).slice(0, 20);

        if (!risultati.length) {
            const vuoto = document.createElement('div');
            vuoto.className = 'result';
            vuoto.textContent = 'Nessun articolo trovato.';
            box.append(vuoto);
        } else {
            risultati.forEach((item) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'result';
                button.setAttribute('role', 'option');
                const codice = document.createElement('span');
                codice.className = 'result-code';
                codice.textContent = item.codice || item.codiceCliente || item.codiceDisegno;
                button.append(codice, document.createTextNode(item.descrizione || '(descrizione non disponibile)'));
                button.addEventListener('click', () => selezionaArticolo(item));
                box.append(button);
            });
        }
        box.classList.add('open');
    }

    function selezionaArticolo(item) {
        articoloSelezionato = item;
        $('search-input').value = `${item.codice || item.codiceCliente} — ${item.descrizione}`;
        $('results-box').classList.remove('open');
        $('add-button').disabled = false;
        $('quantita-input').focus();
    }

    function aggiungiInLista() {
        if (!articoloSelezionato) {
            setStato('Seleziona un articolo tra i risultati del catalogo prima di aggiungerlo.');
            $('search-input').focus();
            return;
        }
        const qta = Number($('quantita-input').value);
        if (!Number.isSafeInteger(qta) || qta < 1) {
            $('quantita-input').setCustomValidity('Inserisci una quantità intera maggiore di zero.');
            $('quantita-input').reportValidity();
            return;
        }
        $('quantita-input').setCustomValidity('');
        const esistente = carrello.find((item) => item.codice === articoloSelezionato.codice);
        if (esistente) esistente.qta += qta;
        else carrello.push({ ...articoloSelezionato, qta });
        aggiornaTabella();
        $('search-input').value = '';
        $('quantita-input').value = '1';
        articoloSelezionato = null;
        $('add-button').disabled = true;
        $('search-input').focus();
        setStato('Articolo aggiunto alla lista.');
    }

    function aggiornaTabella() {
        const corpo = $('lista-corpo');
        corpo.replaceChildren();
        if (!carrello.length) {
            const row = document.createElement('tr');
            const cell = document.createElement('td');
            cell.colSpan = 4;
            cell.className = 'empty';
            cell.textContent = 'La lista è vuota.';
            row.append(cell);
            corpo.append(row);
        } else {
            carrello.forEach((item, index) => {
                const row = document.createElement('tr');
                const code = document.createElement('td');
                const strong = document.createElement('strong');
                strong.textContent = item.codice || item.codiceCliente;
                code.append(strong);
                const description = document.createElement('td');
                description.textContent = item.descrizione || '—';
                const quantity = document.createElement('td');
                quantity.textContent = `${item.qta} pz`;
                const action = document.createElement('td');
                const remove = document.createElement('button');
                remove.type = 'button';
                remove.className = 'remove';
                remove.textContent = 'Rimuovi';
                remove.setAttribute('aria-label', `Rimuovi ${item.codice || item.codiceCliente}`);
                remove.addEventListener('click', () => {
                    carrello.splice(index, 1);
                    aggiornaTabella();
                });
                action.append(remove);
                row.append(code, description, quantity, action);
                corpo.append(row);
            });
        }
        $('cart-count').textContent = `(${carrello.length} ${carrello.length === 1 ? 'articolo' : 'articoli'})`;
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[char]);
    }

    function creaPaginaStampa() {
        if (!carrello.length) {
            window.alert('La lista degli articoli è vuota. Aggiungi almeno un articolo.');
            return;
        }
        const montatore = $('montatore').value.trim();
        const cantiere = $('cantiere').value.trim();
        if (!montatore || !cantiere) {
            window.alert('Inserisci il nome del montatore e il punto vendita / cantiere prima di creare il documento.');
            (!montatore ? $('montatore') : $('cantiere')).focus();
            return;
        }

        const pagina = window.open('', '_blank');
        if (!pagina) {
            window.alert('Il browser ha bloccato la nuova finestra. Abilita i pop-up per questo sito e riprova.');
            return;
        }
        const righe = carrello.map((item) => `<tr><td>${escapeHtml(item.codice || item.codiceCliente)}</td><td>${escapeHtml(item.descrizione || '—')}</td><td>${item.qta}</td></tr>`).join('');
        const nomeDocumento = escapeHtml(cantiere.replace(/[\\/:*?"<>|]/g, '-'));
        pagina.document.open();
        pagina.document.write(`<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordine ${nomeDocumento}</title>
<style>
body{font:15px/1.5 Arial,sans-serif;color:#1e293b;margin:32px}h1{color:#075985;border-bottom:2px solid #0284c7;padding-bottom:10px}.info{padding:14px 18px;margin:20px 0;background:#f1f5f9;border-left:4px solid #0284c7}.info p{margin:4px 0}table{width:100%;border-collapse:collapse;margin-top:18px}th{background:#075985;color:white;text-align:left}th,td{padding:10px;border:1px solid #cbd5e1}tbody tr:nth-child(even){background:#f8fafc}.print{display:block;margin:0 auto 20px;padding:10px 18px;border:0;border-radius:6px;background:#059669;color:white;font-size:15px;font-weight:bold;cursor:pointer}@media print{body{margin:15mm}.print{display:none}thead{display:table-header-group}tr{break-inside:avoid}}
</style></head><body>
<button class="print" onclick="window.print()">🖨️ Stampa / Salva come PDF</button>
<h1>Riepilogo ordine materiali</h1>
<div class="info"><p><strong>Nazione:</strong> ${nazioneAttuale}</p><p><strong>Punto vendita / cantiere:</strong> ${escapeHtml(cantiere)}</p><p><strong>Montatore:</strong> ${escapeHtml(montatore)}</p><p><strong>Data:</strong> ${new Date().toLocaleDateString('it-IT')}</p></div>
<table><thead><tr><th>Codice articolo</th><th>Descrizione componente</th><th>Quantità</th></tr></thead><tbody>${righe}</tbody></table>
</body></html>`);
        pagina.document.close();
        pagina.focus();
        window.setTimeout(() => { try { pagina.print(); } catch (_) { /* usare il pulsante Stampa nella nuova pagina */ } }, 500);
    }

    $('btn-italia').addEventListener('click', () => cambiaNazione('ITALIA'));
    $('btn-spagna').addEventListener('click', () => cambiaNazione('SPAGNA'));
    $('search-input').addEventListener('input', (event) => mostraRisultati(event.target.value));
    $('search-input').addEventListener('keydown', (event) => {
        if (event.key === 'Escape') $('results-box').classList.remove('open');
    });
    document.addEventListener('click', (event) => {
        if (!event.target.closest('.search-wrap')) $('results-box').classList.remove('open');
    });
    $('add-button').addEventListener('click', aggiungiInLista);
    $('print-button').addEventListener('click', creaPaginaStampa);
    $('quantita-input').addEventListener('input', (event) => event.target.setCustomValidity(''));

    caricaCatalogo();
})();
</script>
</body>
</html>
